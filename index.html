<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="light dark" />
  <title>The Brooding Hopster</title>

  <!-- SEO -->
  <meta name="description" content="The Brooding Hopster — Brewed from the tears of hipsters." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Brooding Hopster" />
  <meta property="og:description" content="Brewed from the tears of hipsters." />
  <meta property="og:url" content="https://thebroodinghopster.com" />
  <meta property="og:image" content="https://thebroodinghopster.com/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Brooding Hopster" />
  <meta name="twitter:description" content="Brewed from the tears of hipsters." />
  <meta name="twitter:image" content="https://thebroodinghopster.com/images/og-image.jpg" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Adobe Fonts: New Spirit SemiBold -->
  <link rel="stylesheet" href="https://use.typekit.net/wun4jdi.css" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Apply dark mode before paint to prevent flash -->
  <script>
    (function() {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" role="switch" aria-checked="false">
    <span class="toggle-track">
      <span class="toggle-thumb"></span>
      <span class="toggle-label toggle-label--light">Light</span>
      <span class="toggle-label toggle-label--dark">Dark</span>
    </span>
  </button>

  <!-- Rive canvas lives here -->
  <canvas id="rive-canvas" role="img" aria-label="The Brooding Hopster — animated illustration"></canvas>

  <!-- Fallback image if Rive animation fails to load -->
  <img id="rive-fallback" class="fallback-image" src="images/hopster-v2-shading.svg" alt="The Brooding Hopster" />

  <noscript>
    <img class="fallback-image" style="display:block" src="images/hopster-v2-shading.svg" alt="The Brooding Hopster" />
  </noscript>

  <footer class="site-footer">
    Made by <a href="https://www.jessedestroys.com" target="_blank" rel="noopener noreferrer">www.jessedestroys.com</a>
  </footer>

  <!-- Rive Runtime (jsDelivr CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.7.0"></script>

  <!-- Main Script -->
  <script src="js/main.js"></script>
</body>
</html>
